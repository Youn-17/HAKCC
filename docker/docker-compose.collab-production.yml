name: hakcc-collab
services:
  collaboration:
    image: ${HAKCC_COLLAB_IMAGE:?Set the reviewed release image}
    # Linux VPS only: reach the existing systemd API without publishing an internal port.
    network_mode: host
    env_file: ${COLLAB_ENV_FILE:?Set your private environment file}
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: 4310
      COLLAB_DEMO: 'false'
      COLLAB_AUTH_API_URL: ${COLLAB_AUTH_API_URL:?Set the existing API callback URL}
      COLLAB_DB_PATH: /data/documents.sqlite
    volumes:
      - ${COLLAB_DATA_DIR:?Set your persistent data directory}:/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4310/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
