services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend-only
      args:
        # Point frontend directly to an already-running backend container/service.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
